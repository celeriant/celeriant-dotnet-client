name: CI

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - framework: net8.0
            dotnet-version: 8.0.x
          - framework: net9.0
            dotnet-version: 9.0.x
          - framework: net10.0
            dotnet-version: 10.0.x

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK 10 and ${{ matrix.dotnet-version }} runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            ${{ matrix.dotnet-version }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test Celeriant.Client.Tests --no-build --configuration Release --framework ${{ matrix.framework }} --verbosity normal

      - name: Transport unit tests
        run: dotnet test Celeriant.Transport.Tests --no-build --configuration Release --framework ${{ matrix.framework }} --verbosity normal

  pack:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # Transport must be packed and pushed alongside Client: the Client package
      # declares a NuGet dependency on it, which is unsatisfiable otherwise.
      - name: Pack
        run: |
          dotnet pack Celeriant.Transport --configuration Release --output ./artifacts
          dotnet pack Celeriant.Client --configuration Release --output ./artifacts

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts/*.nupkg

      - name: Upload symbol package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-symbols
          path: ./artifacts/*.snupkg

  publish:
    runs-on: ubuntu-latest
    needs: pack
    # Tag-gated: releases happen only on a v* tag, never on ordinary pushes.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: nuget

    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts

      - name: Download symbols
        uses: actions/download-artifact@v4
        with:
          name: nuget-symbols
          path: ./artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Order matters. Celeriant.Client declares a dependency on Celeriant.Transport
      # at the same version, so Transport has to be accepted first: a glob pushes
      # Client first (alphabetical) and leaves a window where the newest Client is
      # listed against a Transport that does not exist yet and cannot be restored.
      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          NUGET_SOURCE: https://api.nuget.org/v3/index.json
        run: |
          set -euo pipefail
          push() {
            dotnet nuget push "$1" --api-key "$NUGET_API_KEY" --source "$NUGET_SOURCE" --skip-duplicate
          }
          push './artifacts/Celeriant.Transport.*.nupkg'
          push './artifacts/Celeriant.Client.*.nupkg'
          push './artifacts/Celeriant.Transport.*.snupkg'
          push './artifacts/Celeriant.Client.*.snupkg'
